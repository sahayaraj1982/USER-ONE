<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAHAYARAJ-2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --p-bg: #0c40bb; --n-col: #ffffff; --out: #54301d; --btm: #0b08d4; --c-let: #e32b2b; --c-num: #1e40af; }
        body { background-color: #475569; font-family: 'Arial Black', sans-serif; overflow-x: hidden; }
        * { font-weight: 950 !important; }
        .main-app-box { border: 10px solid var(--out); margin: 10px auto; border-radius: 40px; background: #f1f5f9; overflow-x: hidden; transition: 0.3s; }
        .premium-header { background-color: var(--p-bg); padding: 25px; border-bottom: 10px solid var(--btm); position: relative; }
        .cat-card { background: #fff; border: 5px solid var(--out); border-radius: 20px; text-align: center; }
        .btn-style { border-bottom: 6px solid #000; color: #fff !important; cursor: pointer; transition: 0.1s; text-transform: uppercase; }
        .btn-style:active { transform: translateY(3px); border-bottom-width: 3px; }
        .cp-card { background: #fff; width: 98%; max-width: 1300px; border-radius: 40px; padding: 20px; border: 10px solid #000; max-height: 95vh; overflow-y: auto; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 4px 10px; border: 2px solid #000; border-radius: 10px; margin-bottom: 2px; font-size: 11px; }
        #loginPage { position: fixed; inset: 0; background: #1e293b; z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body onload="checkLogin()">

<div id="loginPage">
    <div class="bg-white p-8 rounded-[40px] border-[10px] border-blue-900 w-full max-w-sm">
        <h2 class="text-3xl text-center mb-6 text-blue-900 italic uppercase">User Access</h2>
        <input type="tel" id="uMob" placeholder="MOBILE NUMBER" class="w-full p-4 border-4 border-black rounded-xl text-xl mb-4">
        <input type="password" id="uPin" placeholder="PASSWORD" class="w-full p-4 border-4 border-black rounded-xl text-xl mb-6">
        <div class="grid grid-cols-2 gap-4">
            <button onclick="doLogin()" class="bg-green-600 p-4 rounded-xl btn-style">LOGIN</button>
            <button onclick="doReg()" class="bg-blue-600 p-4 rounded-xl btn-style">REGISTER</button>
        </div>
    </div>
</div>

<div id="appPage" class="hidden">
    <div id="mainContainer" class="main-app-box mx-auto">
        <div class="premium-header">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button onclick="logout()" class="bg-red-600 w-12 h-12 rounded-full border-4 border-black text-white">Exit</button>
                    <button onclick="document.getElementById('bellDate').showPicker()" class="bg-yellow-400 w-12 h-12 rounded-full border-4 border-black text-2xl">🔔</button>
                    <input type="date" id="bellDate" onchange="setStart()" class="absolute opacity-0">
                    <div>
                        <h1 id="dispTitle" class="text-4xl italic uppercase" style="color: var(--n-col);">SAHAYARAJ-2026</h1>
                        <p id="liveClock" class="text-xs text-yellow-300 font-mono mt-1"></p>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-right text-white">
                        <p class="text-xs opacity-70">RECORDS: <span id="recCount">0</span></p>
                        <h2 id="mainTotal" class="text-4xl">₹0</h2>
                    </div>
                    <button onclick="openSettings()" class="text-5xl text-white">⚙️</button>
                </div>
            </div>
        </div>

        <div class="p-6">
            <div id="catGrid" class="grid grid-cols-2 md:grid-cols-7 gap-3 mb-6"></div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white p-5 rounded-3xl border-4 border-black">
                    <h3 class="text-xl border-b-4 border-green-600 mb-4 italic uppercase">New Entry</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" id="eDate" class="border-2 border-black p-2 rounded">
                        <input type="tel" id="eMob" placeholder="Mobile" class="border-2 border-black p-2 rounded">
                        <select id="eCat" class="border-2 border-black p-2 rounded"></select>
                        <input type="text" id="eDesc" placeholder="Remark" class="border-2 border-black p-2 rounded">
                        <input type="number" id="eAmt" placeholder="Amount" class="border-2 border-black p-2 rounded">
                        <select id="eType" class="border-2 border-black p-2 rounded"><option value="CR">IN (+)</option><option value="DR">OUT (-)</option></select>
                    </div>
                    <button onclick="saveData()" class="w-full py-4 mt-5 rounded-xl text-xl btn-style bg-green-600">SAVE ✅</button>
                </div>
                <div class="bg-white p-5 rounded-3xl border-4 border-black">
                    <h3 class="text-xl border-b-4 border-blue-600 mb-4 italic uppercase">Search & Tools</h3>
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <input type="date" id="fDate" class="text-xs border-2 border-black p-1">
                        <input type="date" id="tDate" class="text-xs border-2 border-black p-1">
                        <input type="tel" id="sMob" placeholder="Mobile" class="text-xs border-2 border-black p-1">
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="downloadPDF()" class="bg-orange-600 py-3 rounded-lg btn-style text-[10px]">PDF</button>
                        <button onclick="location.reload()" class="bg-blue-600 py-3 rounded-lg btn-style text-[10px]">DRIVE</button>
                        <button onclick="deleteAll()" class="bg-red-600 py-3 rounded-lg btn-style text-[10px]">DELETE ALL</button>
                        <button onclick="exportData()" class="bg-purple-600 py-3 rounded-lg btn-style text-[10px]">EXPORT</button>
                        <button onclick="refresh()" class="bg-slate-800 py-3 rounded-lg btn-style text-[10px] col-span-2">SEARCH 🔎</button>
                    </div>
                </div>
            </div>
            <div class="mt-6 bg-white border-4 border-black rounded-3xl overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-black text-white"><tr><th class="p-2">DATE</th><th class="p-2">MOBILE</th><th class="p-2">CAT</th><th class="p-2">REMARK</th><th class="p-2 text-right">AMOUNT</th><th class="p-2">ACTION</th></tr></thead>
                    <tbody id="resTable" class="text-center"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="setModal" class="hidden fixed inset-0 bg-black/90 z-[3000] flex items-center justify-center p-2">
    <div class="cp-card">
        <h2 class="text-2xl mb-4 uppercase">System Control Panel</h2>
        <div id="setArea" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
        <button onclick="saveSettings()" class="w-full bg-blue-700 text-white py-4 mt-6 rounded-xl btn-style">SAVE ALL ✅</button>
        <button onclick="closeSettings()" class="w-full bg-red-600 text-white py-2 mt-2 rounded-xl btn-style">CLOSE</button>
    </div>
</div>

<script>
let curU = null;
let cfg = JSON.parse(localStorage.getItem('global_cfg')) || {
    title: "SAHAYARAJ-2026", headCol: "#0c40bb", nameCol: "#ffffff", outCol: "#54301d", btmCol: "#0b08d4",
    scrW: 95, fsDT: 22, cats: ["TICKET","FINANCE","RO","OTHER","SHOP","GENERAL","EXTRA"],
    catStatus: [true,true,true,true,true,true,true], startD: ""
};
let db = [];

function checkLogin() {
    curU = sessionStorage.getItem('loggedUser');
    if(curU) {
        db = JSON.parse(localStorage.getItem('db_' + curU)) || [];
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        init();
    }
}

function doReg() {
    let m = document.getElementById('uMob').value, p = document.getElementById('uPin').value;
    if(m.length<10 || !p) return alert("விவரங்களைச் சரியாக உள்ளிடவும்!");
    localStorage.setItem('pw_' + m, p); alert("பதிவு செய்யப்பட்டது!");
}

function doLogin() {
    let m = document.getElementById('uMob').value, p = document.getElementById('uPin').value;
    if(localStorage.getItem('pw_' + m) === p) { sessionStorage.setItem('loggedUser', m); location.reload(); }
    else alert("தவறான விவரங்கள்!");
}

function logout() { sessionStorage.clear(); location.reload(); }

function init() {
    document.documentElement.style.setProperty('--p-bg', cfg.headCol);
    document.documentElement.style.setProperty('--n-col', cfg.nameCol);
    document.documentElement.style.setProperty('--out', cfg.outCol);
    document.documentElement.style.setProperty('--btm', cfg.btmCol);
    document.getElementById('mainContainer').style.width = cfg.scrW + "%";
    document.getElementById('dispTitle').innerText = cfg.title;

    setInterval(() => {
        let d = new Date();
        document.getElementById('liveClock').innerText = d.toLocaleDateString('en-GB') + " | " + d.toLocaleTimeString();
    }, 1000);

    let g = document.getElementById('catGrid'), s = document.getElementById('eCat');
    g.innerHTML = ""; s.innerHTML = "";
    cfg.cats.forEach((c, i) => {
        if(cfg.catStatus[i]) {
            g.innerHTML += `<div class="cat-card"><p class="text-xs">${c}</p><h3 class="text-xl">₹<span id="sum_${c}">0</span></h3></div>`;
            s.innerHTML += `<option value="${c}">${c}</option>`;
        }
    });
    refresh();
}

function refresh() {
    let fd = document.getElementById('fDate').value, td = document.getElementById('tDate').value, sm = document.getElementById('sMob').value;
    let h = "", gt = 0, sums = {}; cfg.cats.forEach(c => sums[c] = 0);

    let flt = db.filter(t => (!fd || t.date >= fd) && (!td || t.date <= td) && (!sm || t.mob.includes(sm)) && (!cfg.startD || t.date >= cfg.startD));
    flt.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
        let v = (t.type === "CR") ? parseFloat(t.amt) : -parseFloat(t.amt);
        sums[t.cat] += v; gt += v;
        h += `<tr class="border-b"><td>${t.date.split('-').reverse().join('/')}</td><td>${t.mob}</td><td>${t.cat}</td><td>${t.desc}</td><td class="text-right ${t.type==='CR'?'text-green-600':'text-red-600'}">₹${t.amt}</td><td><button onclick="del(${t.id})">✖</button></td></tr>`;
    });

    document.getElementById('resTable').innerHTML = h;
    document.getElementById('mainTotal').innerText = "₹" + gt.toLocaleString();
    document.getElementById('recCount').innerText = flt.length;
    cfg.cats.forEach(c => { if(document.getElementById('sum_'+c)) document.getElementById('sum_'+c).innerText = sums[c].toLocaleString(); });
    window.lastFlt = flt;
}

function saveData() {
    let d = document.getElementById('eDate').value, a = document.getElementById('eAmt').value;
    if(!d || !a) return alert("தேதி/தொகை தேவை!");
    if(!confirm(`சேமிக்கலாமா?\nதேதி: ${d}\nதொகை: ${a}`)) return;
    db.push({id: Date.now(), date: d, mob: document.getElementById('eMob').value || "-", cat: document.getElementById('eCat').value, desc: document.getElementById('eDesc').value || "-", amt: a, type: document.getElementById('eType').value});
    localStorage.setItem('db_' + curU, JSON.stringify(db)); refresh();
}

function downloadPDF() {
    const { jsPDF } = window.jspdf; let doc = new jsPDF();
    doc.text(cfg.title + " REPORT", 14, 15);
    let summary = cfg.cats.map((c, i) => cfg.catStatus[i] ? [c, "Rs. " + (document.getElementById('sum_'+c)?.innerText || "0")] : null).filter(x => x);
    doc.autoTable({ head: [['CAT', 'BAL']], body: summary, startY: 20 });
    doc.autoTable({ head: [['DATE', 'MOB', 'CAT', 'REM', 'AMT']], body: window.lastFlt.map(t => [t.date, t.mob, t.cat, t.desc, t.amt]), startY: doc.lastAutoTable.finalY + 10 });
    doc.save('report.pdf');
}

function openSettings() { document.getElementById('setModal').classList.remove('hidden'); }
function closeSettings() { document.getElementById('setModal').classList.add('hidden'); }
function saveSettings() { localStorage.setItem('global_cfg', JSON.stringify(cfg)); location.reload(); }
function del(id) { if(confirm("நீக்கலாமா?")) { db = db.filter(x => x.id !== id); localStorage.setItem('db_'+curU, JSON.stringify(db)); refresh(); } }
function deleteAll() { if(confirm("அனைத்தையும் நீக்கவா?")) { db = []; localStorage.setItem('db_'+curU, JSON.stringify(db)); refresh(); } }
function setStart() { cfg.startD = document.getElementById('bellDate').value; saveSettings(); }
</script>
</body>
</html>
